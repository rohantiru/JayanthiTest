<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Adventure!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #FF6B35;
      --yellow: #FFD23F;
      --green: #06D6A0;
      --blue: #118AB2;
      --purple: #8338EC;
      --pink: #FF006E;
      --bg: #FFF8F0;
      --card: #FFFFFF;
      --dark: #1A1A2E;
      --radius: 20px;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      color: var(--dark);
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--orange), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 1.05rem;
      color: #888;
      margin-bottom: 24px;
      text-align: center;
    }

    /* ── SCREENS ── */
    .screen { width: 100%; max-width: 600px; display: none; }
    .screen.active { display: block; }

    /* ── START SCREEN ── */
    .difficulty-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .diff-btn {
      border: 3px solid transparent;
      border-radius: var(--radius);
      padding: 20px 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
      background: var(--card);
      text-align: center;
    }

    .diff-btn .emoji { font-size: 2rem; display: block; margin-bottom: 6px; }
    .diff-btn[data-diff="easy"]   { border-color: var(--green);  color: var(--green); }
    .diff-btn[data-diff="medium"] { border-color: var(--orange); color: var(--orange); }
    .diff-btn[data-diff="hard"]   { border-color: var(--purple); color: var(--purple); }
    .diff-btn.selected[data-diff="easy"]   { background: var(--green);  color: #fff; }
    .diff-btn.selected[data-diff="medium"] { background: var(--orange); color: #fff; }
    .diff-btn.selected[data-diff="hard"]   { background: var(--purple); color: #fff; }
    .diff-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,.12); }

    .type-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .type-btn {
      border: 2px solid #E0E0E0;
      border-radius: 14px;
      padding: 14px 10px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--card);
      color: #555;
      transition: all .2s;
      text-align: center;
    }

    .type-btn .emoji { font-size: 1.5rem; display: block; margin-bottom: 4px; }
    .type-btn.selected { border-color: var(--blue); background: #EAF4FF; color: var(--blue); }
    .type-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }

    .big-btn {
      width: 100%;
      padding: 18px;
      border-radius: var(--radius);
      border: none;
      font-size: 1.3rem;
      font-weight: 800;
      cursor: pointer;
      transition: all .2s;
      background: linear-gradient(135deg, var(--orange), var(--pink));
      color: white;
      box-shadow: 0 6px 20px rgba(255, 107, 53, .35);
    }

    .big-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(255, 107, 53, .45); }
    .big-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* ── GAME SCREEN ── */
    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hud-pill {
      background: var(--card);
      border-radius: 50px;
      padding: 8px 16px;
      font-weight: 700;
      font-size: .95rem;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .timer-ring {
      position: relative;
      width: 60px;
      height: 60px;
      flex-shrink: 0;
    }

    .timer-ring svg { transform: rotate(-90deg); }

    .timer-ring circle {
      fill: none;
      stroke-width: 5;
      stroke-linecap: round;
    }

    .timer-track { stroke: #EEE; }

    .timer-progress {
      stroke: var(--orange);
      stroke-dasharray: 163;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset .9s linear, stroke .3s;
    }

    .timer-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.1rem;
    }

    .question-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 32px 24px;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,.07);
      text-align: center;
      min-height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    .question-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--orange), var(--purple));
    }

    .q-type-badge {
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      padding: 4px 12px;
      border-radius: 50px;
      background: #F0F0F0;
      color: #888;
    }

    .question-text {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 800;
      line-height: 1.3;
    }

    .hint-text {
      font-size: .9rem;
      color: #999;
      font-style: italic;
    }

    /* Multiple choice */
    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .choice-btn {
      border: 2.5px solid #E8E8E8;
      border-radius: 14px;
      padding: 18px 10px;
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      background: var(--card);
      transition: all .15s;
    }

    .choice-btn:hover:not(:disabled) { border-color: var(--blue); background: #EAF4FF; transform: scale(1.03); }
    .choice-btn.correct  { background: var(--green)  !important; color: #fff; border-color: var(--green)  !important; transform: scale(1.05); }
    .choice-btn.wrong    { background: var(--pink)   !important; color: #fff; border-color: var(--pink)   !important; }
    .choice-btn.reveal   { background: var(--green)  !important; color: #fff; border-color: var(--green)  !important; opacity: .7; }
    .choice-btn:disabled { cursor: default; }

    /* Free input */
    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .answer-input {
      flex: 1;
      border: 2.5px solid #E8E8E8;
      border-radius: 14px;
      padding: 16px;
      font-size: 1.4rem;
      font-weight: 700;
      text-align: center;
      outline: none;
      transition: border-color .2s;
    }

    .answer-input:focus { border-color: var(--blue); }
    .answer-input.correct { border-color: var(--green); background: #EAFFF7; }
    .answer-input.wrong   { border-color: var(--pink);  background: #FFF0F5; }

    .submit-btn {
      border: none;
      border-radius: 14px;
      padding: 16px 24px;
      font-size: 1.1rem;
      font-weight: 800;
      background: var(--blue);
      color: white;
      cursor: pointer;
      transition: all .2s;
    }

    .submit-btn:hover { background: #0D6E8A; transform: scale(1.04); }

    /* Feedback banner */
    .feedback {
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 14px;
      display: none;
    }

    .feedback.show { display: block; }
    .feedback.correct { background: #EAFFF7; color: #047857; border: 2px solid #A7F3D0; }
    .feedback.wrong   { background: #FFF0F5; color: #BE185D; border: 2px solid #FBCFE8; }

    .next-btn {
      width: 100%;
      padding: 16px;
      border-radius: var(--radius);
      border: none;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      background: var(--blue);
      color: white;
      transition: all .2s;
      display: none;
    }

    .next-btn.show { display: block; }
    .next-btn:hover { background: #0D6E8A; transform: translateY(-2px); }

    /* Progress bar */
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #EEE;
      border-radius: 50px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--orange), var(--purple));
      border-radius: 50px;
      transition: width .4s ease;
    }

    /* ── RESULTS SCREEN ── */
    .results-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
      margin-bottom: 20px;
    }

    .trophy { font-size: 5rem; margin-bottom: 12px; }

    .final-score {
      font-size: 3rem;
      font-weight: 900;
      color: var(--orange);
      margin-bottom: 8px;
    }

    .score-label { font-size: 1.1rem; color: #888; margin-bottom: 20px; }

    .stars { font-size: 2.5rem; letter-spacing: 4px; margin-bottom: 20px; }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .stat-box {
      background: #F8F8F8;
      border-radius: 14px;
      padding: 14px 8px;
      text-align: center;
    }

    .stat-val { font-size: 1.5rem; font-weight: 800; }
    .stat-lbl { font-size: .75rem; color: #888; text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }

    .results-btns { display: flex; gap: 10px; }

    .outline-btn {
      flex: 1;
      padding: 16px;
      border-radius: var(--radius);
      border: 2.5px solid var(--blue);
      font-size: 1rem;
      font-weight: 800;
      color: var(--blue);
      background: transparent;
      cursor: pointer;
      transition: all .2s;
    }

    .outline-btn:hover { background: #EAF4FF; }

    /* ── ANIMATIONS ── */
    @keyframes pop { 0%{transform:scale(.8);opacity:0} 70%{transform:scale(1.05)} 100%{transform:scale(1);opacity:1} }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
    @keyframes confetti-fall { 0%{transform:translateY(-10px) rotate(0deg);opacity:1} 100%{transform:translateY(100vh) rotate(720deg);opacity:0} }

    .pop { animation: pop .3s ease both; }
    .shake { animation: shake .35s ease both; }

    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 14px;
      border-radius: 2px;
      animation: confetti-fall linear both;
      pointer-events: none;
      z-index: 9999;
    }

    /* Streak badge */
    .streak-badge {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      background: var(--yellow);
      color: var(--dark);
      font-weight: 800;
      font-size: 1.1rem;
      padding: 10px 24px;
      border-radius: 50px;
      box-shadow: 0 6px 20px rgba(0,0,0,.15);
      z-index: 100;
      transition: transform .3s cubic-bezier(.34,1.56,.64,1);
      white-space: nowrap;
    }

    .streak-badge.show { transform: translateX(-50%) scale(1); }

    label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 1rem; }
    .section-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 10px; color: var(--dark); }
  </style>
</head>
<body>

<h1>🧮 Math Adventure!</h1>
<p class="subtitle">Fun puzzles for curious minds ✨</p>

<!-- ── START SCREEN ── -->
<div class="screen active" id="startScreen">
  <p class="section-title">Choose your level:</p>
  <div class="difficulty-grid">
    <button class="diff-btn" data-diff="easy">
      <span class="emoji">🌱</span>Easy
    </button>
    <button class="diff-btn selected" data-diff="medium">
      <span class="emoji">🔥</span>Medium
    </button>
    <button class="diff-btn" data-diff="hard">
      <span class="emoji">🚀</span>Hard
    </button>
  </div>

  <p class="section-title">Pick your puzzles:</p>
  <div class="type-grid">
    <button class="type-btn selected" data-type="arithmetic">
      <span class="emoji">➕➖✖️➗</span>Arithmetic
    </button>
    <button class="type-btn selected" data-type="patterns">
      <span class="emoji">🔢</span>Number Patterns
    </button>
    <button class="type-btn selected" data-type="wordproblems">
      <span class="emoji">📖</span>Word Problems
    </button>
    <button class="type-btn selected" data-type="comparison">
      <span class="emoji">⚖️</span>Compare &amp; Order
    </button>
  </div>

  <button class="big-btn" id="startBtn">Let's Play! 🎮</button>
</div>

<!-- ── GAME SCREEN ── -->
<div class="screen" id="gameScreen">
  <div class="hud">
    <div class="hud-pill">⭐ <span id="scoreDisplay">0</span></div>
    <div class="timer-ring">
      <svg viewBox="0 0 60 60" width="60" height="60">
        <circle class="timer-track" cx="30" cy="30" r="26"/>
        <circle class="timer-progress" id="timerArc" cx="30" cy="30" r="26"/>
      </svg>
      <div class="timer-label" id="timerLabel">30</div>
    </div>
    <div class="hud-pill">Q <span id="qNumDisplay">1</span>/10</div>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>

  <div class="question-card" id="questionCard">
    <div class="q-type-badge" id="qTypeBadge">Arithmetic</div>
    <div class="question-text" id="questionText"></div>
    <div class="hint-text" id="hintText"></div>
  </div>

  <div class="choices-grid" id="choicesGrid"></div>
  <div class="input-row" id="inputRow" style="display:none">
    <input class="answer-input" id="answerInput" type="number" placeholder="?" autocomplete="off" />
    <button class="submit-btn" id="submitBtn">✓</button>
  </div>

  <div class="feedback" id="feedbackBanner"></div>
  <button class="next-btn" id="nextBtn">Next Question →</button>
</div>

<!-- ── RESULTS SCREEN ── -->
<div class="screen" id="resultsScreen">
  <div class="results-card">
    <div class="trophy" id="trophyEmoji">🏆</div>
    <div class="final-score" id="finalScore">0</div>
    <div class="score-label">points</div>
    <div class="stars" id="starsDisplay">⭐⭐⭐</div>
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-val" id="statCorrect">0</div>
        <div class="stat-lbl">Correct</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="statWrong">0</div>
        <div class="stat-lbl">Missed</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="statStreak">0</div>
        <div class="stat-lbl">Best Streak</div>
      </div>
    </div>
    <p id="resultMessage" style="color:#666;font-size:1rem;margin-bottom:0;"></p>
  </div>
  <div class="results-btns">
    <button class="outline-btn" id="changeSettingsBtn">⚙️ Settings</button>
    <button class="big-btn" id="playAgainBtn" style="flex:1">Play Again! 🎮</button>
  </div>
</div>

<div class="streak-badge" id="streakBadge"></div>

<script>
// ─────────────────────────────────────────────
//  CONFIG
// ─────────────────────────────────────────────
const TOTAL_QUESTIONS = 10;
const TIMER_SECS = { easy: 30, medium: 20, hard: 12 };
const POINTS = { correct: 10, streak3: 5, streak5: 10, timerBonus: 3 };

// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
let difficulty = 'medium';
let enabledTypes = new Set(['arithmetic','patterns','wordproblems','comparison']);
let score = 0, qIndex = 0, correctCount = 0, wrongCount = 0;
let streak = 0, bestStreak = 0;
let timeLeft = 20, timerInterval = null;
let answered = false;
let questions = [];

// ─────────────────────────────────────────────
//  QUESTION GENERATORS
// ─────────────────────────────────────────────
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffle(arr) { return [...arr].sort(() => Math.random() - .5); }

function makeArithmetic(diff) {
  const ops = diff === 'easy' ? ['+','-'] : diff === 'medium' ? ['+','-','×'] : ['+','-','×','÷'];
  const op = ops[rand(0, ops.length - 1)];
  let a, b, answer;

  if (op === '+') {
    a = diff === 'easy' ? rand(1,20)  : diff === 'medium' ? rand(10,99)  : rand(50,999);
    b = diff === 'easy' ? rand(1,20)  : diff === 'medium' ? rand(10,99)  : rand(50,999);
    answer = a + b;
  } else if (op === '-') {
    b = diff === 'easy' ? rand(1,20)  : diff === 'medium' ? rand(5,50)   : rand(10,200);
    a = b + (diff === 'easy' ? rand(0,20) : diff === 'medium' ? rand(0,50) : rand(0,200));
    answer = a - b;
  } else if (op === '×') {
    a = diff === 'medium' ? rand(2,9)  : rand(3,15);
    b = diff === 'medium' ? rand(2,9)  : rand(3,15);
    answer = a * b;
  } else {
    a = diff === 'medium' ? rand(2,9)  : rand(2,12);
    b = rand(2, diff === 'medium' ? 9 : 12);
    answer = a * b; // ask a×b ÷ b
    const dividend = answer;
    answer = a;
    return {
      type: 'arithmetic', badge: 'Arithmetic',
      text: `${dividend} ÷ ${b} = ?`,
      answer, mode: 'mc',
      choices: makeChoices(answer, 1, diff === 'easy' ? 5 : diff === 'medium' ? 10 : 20)
    };
  }

  return {
    type: 'arithmetic', badge: 'Arithmetic',
    text: `${a} ${op} ${b} = ?`,
    answer, mode: 'mc',
    choices: makeChoices(answer, 1, diff === 'easy' ? 5 : diff === 'medium' ? 15 : 30)
  };
}

function makePattern(diff) {
  const patterns = [
    // arithmetic sequences
    () => {
      const step = diff === 'easy' ? rand(2,5) : diff === 'medium' ? rand(3,10) : rand(5,20);
      const start = rand(1, diff === 'easy' ? 10 : 30);
      const seq = [start, start+step, start+2*step, start+3*step];
      const answer = start + 4*step;
      return { seq, answer, hint: `Add ${step} each time` };
    },
    // multiply sequences
    () => {
      const factor = diff === 'easy' ? 2 : diff === 'medium' ? rand(2,3) : rand(2,4);
      const start = rand(1, diff === 'easy' ? 5 : 10);
      const seq = [start, start*factor, start*factor**2, start*factor**3];
      const answer = start*factor**4;
      return { seq, answer, hint: `Multiply by ${factor} each time` };
    },
    // fibonacci-style
    () => {
      const a = rand(1, diff === 'easy' ? 3 : 8);
      const b = rand(1, diff === 'easy' ? 3 : 8);
      const seq = [a, b, a+b, a+2*b];
      const answer = 2*a + 3*b;
      return { seq, answer, hint: `Add the two previous numbers` };
    },
    // squares
    () => {
      const start = rand(1, diff === 'easy' ? 3 : 5);
      const seq = [start**2, (start+1)**2, (start+2)**2, (start+3)**2];
      const answer = (start+4)**2;
      return { seq, answer, hint: `Perfect squares!` };
    }
  ];

  const { seq, answer, hint } = patterns[rand(0, patterns.length - 1)]();
  return {
    type: 'patterns', badge: 'Pattern',
    text: `${seq.join(', ')}, ?, ...`,
    hint: `Hint: ${hint}`,
    answer, mode: 'mc',
    choices: makeChoices(answer, 1, diff === 'easy' ? 5 : diff === 'medium' ? 15 : 40)
  };
}

function makeWordProblem(diff) {
  const problems = [
    // apples
    () => {
      const a = rand(5, diff==='easy'?15:diff==='medium'?30:80);
      const b = rand(2, diff==='easy'?10:diff==='medium'?25:60);
      const give = rand(1, Math.min(a,b));
      const answer = a + b - give;
      return {
        text: `Sam had ${a} apples 🍎. Jordan gave Sam ${b} more, but then Sam gave away ${give}. How many apples does Sam have now?`,
        answer
      };
    },
    // candy bags
    () => {
      const bags = rand(2, diff==='easy'?5:10);
      const perBag = rand(4, diff==='easy'?8:diff==='medium'?15:30);
      const answer = bags * perBag;
      return {
        text: `There are ${bags} bags of candy 🍬. Each bag has ${perBag} pieces. How many pieces total?`,
        answer
      };
    },
    // sharing pizza
    () => {
      const kids = rand(2, diff==='easy'?4:6);
      const slices = kids * rand(2, diff==='easy'?3:5);
      const answer = slices / kids;
      return {
        text: `${slices} pizza slices 🍕 are shared equally among ${kids} kids. How many slices does each kid get?`,
        answer
      };
    },
    // money
    () => {
      const price = rand(5, diff==='easy'?20:diff==='medium'?50:100);
      const paid = price + rand(1, diff==='easy'?10:30);
      const answer = paid - price;
      return {
        text: `A toy costs $${price} 🧸. You pay with $${paid}. How much change do you get back?`,
        answer
      };
    },
    // race
    () => {
      const laps = rand(3, diff==='easy'?6:10);
      const dist = rand(100, diff==='easy'?400:diff==='medium'?800:2000);
      const answer = laps * dist;
      return {
        text: `A runner completes ${laps} laps 🏃. Each lap is ${dist} meters. How many meters total?`,
        answer
      };
    },
    // books on shelves
    () => {
      const shelves = rand(3, diff==='easy'?5:8);
      const perShelf = rand(6, diff==='easy'?12:diff==='medium'?20:40);
      const answer = shelves * perShelf;
      return {
        text: `A library has ${shelves} shelves 📚. Each shelf holds ${perShelf} books. How many books in total?`,
        answer
      };
    }
  ];

  const { text, answer } = problems[rand(0, problems.length - 1)]();
  return {
    type: 'wordproblems', badge: 'Word Problem',
    text, answer, mode: 'input'
  };
}

function makeComparison(diff) {
  const types = ['order', 'missing', 'greatest'];
  const t = types[rand(0, types.length - 1)];

  if (t === 'missing') {
    const step = diff === 'easy' ? rand(2,5) : diff === 'medium' ? rand(3,15) : rand(5,25);
    const start = rand(5, 50);
    const pos = rand(1, 3);
    const seq = [start, start+step, start+2*step, start+3*step];
    const answer = seq[pos];
    seq[pos] = '?';
    return {
      type: 'comparison', badge: 'Fill the Gap',
      text: `${seq.join(' , ')}`,
      hint: `What number belongs in the gap?`,
      answer, mode: 'mc',
      choices: makeChoices(answer, 1, diff==='easy'?8:20)
    };
  }

  if (t === 'greatest') {
    const nums = Array.from({length: 4}, () => rand(10, diff==='easy'?50:diff==='medium'?200:999));
    const answer = Math.max(...nums);
    return {
      type: 'comparison', badge: 'Compare',
      text: `Which is the BIGGEST?\n${nums.join('   ')}`,
      answer, mode: 'mc',
      choices: shuffle(nums).map(String)
    };
  }

  // order: smallest
  const nums = Array.from({length: 4}, () => rand(10, diff==='easy'?50:diff==='medium'?200:999));
  const answer = Math.min(...nums);
  return {
    type: 'comparison', badge: 'Compare',
    text: `Which is the SMALLEST?\n${nums.join('   ')}`,
    answer, mode: 'mc',
    choices: shuffle(nums).map(String)
  };
}

function makeChoices(answer, min, range) {
  const set = new Set([answer]);
  while (set.size < 4) {
    const off = rand(1, range) * (Math.random() < .5 ? 1 : -1);
    const c = answer + off;
    if (c >= min) set.add(c);
  }
  return shuffle([...set]).map(String);
}

function generateQuestions() {
  const types = [...enabledTypes];
  if (!types.length) return [];
  const qs = [];
  for (let i = 0; i < TOTAL_QUESTIONS; i++) {
    const t = types[i % types.length];
    if (t === 'arithmetic')   qs.push(makeArithmetic(difficulty));
    else if (t === 'patterns') qs.push(makePattern(difficulty));
    else if (t === 'wordproblems') qs.push(makeWordProblem(difficulty));
    else qs.push(makeComparison(difficulty));
  }
  return shuffle(qs);
}

// ─────────────────────────────────────────────
//  TIMER
// ─────────────────────────────────────────────
const arc = document.getElementById('timerArc');
const CIRCUMFERENCE = 163;

function setTimerUI(secs, total) {
  const frac = secs / total;
  arc.style.strokeDashoffset = CIRCUMFERENCE * (1 - frac);
  arc.style.stroke = frac > .5 ? 'var(--green)' : frac > .25 ? 'var(--yellow)' : 'var(--pink)';
  document.getElementById('timerLabel').textContent = secs;
}

function startTimer() {
  const total = TIMER_SECS[difficulty];
  timeLeft = total;
  setTimerUI(timeLeft, total);
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    setTimerUI(timeLeft, total);
    if (timeLeft <= 0) { clearInterval(timerInterval); timeUp(); }
  }, 1000);
}

function stopTimer() { clearInterval(timerInterval); }

function timeUp() {
  if (answered) return;
  answered = true;
  streak = 0;
  wrongCount++;
  showFeedback(false, `⏰ Time's up! The answer was ${questions[qIndex].answer}`);
  revealAnswer();
  showNext();
}

// ─────────────────────────────────────────────
//  RENDER QUESTION
// ─────────────────────────────────────────────
function renderQuestion() {
  answered = false;
  const q = questions[qIndex];

  document.getElementById('qNumDisplay').textContent = qIndex + 1;
  document.getElementById('progressFill').style.width = `${(qIndex / TOTAL_QUESTIONS) * 100}%`;
  document.getElementById('qTypeBadge').textContent = q.badge;
  document.getElementById('questionText').textContent = q.text;
  document.getElementById('hintText').textContent = q.hint || '';
  document.getElementById('feedbackBanner').className = 'feedback';
  document.getElementById('nextBtn').className = 'next-btn';

  const choicesGrid = document.getElementById('choicesGrid');
  const inputRow = document.getElementById('inputRow');
  const answerInput = document.getElementById('answerInput');

  choicesGrid.innerHTML = '';
  answerInput.value = '';
  answerInput.className = 'answer-input';

  if (q.mode === 'mc') {
    choicesGrid.style.display = 'grid';
    inputRow.style.display = 'none';
    q.choices.forEach(choice => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = choice;
      btn.addEventListener('click', () => handleChoice(btn, choice, q));
      choicesGrid.appendChild(btn);
    });
  } else {
    choicesGrid.style.display = 'none';
    inputRow.style.display = 'flex';
    answerInput.focus();
  }

  document.getElementById('questionCard').classList.add('pop');
  setTimeout(() => document.getElementById('questionCard').classList.remove('pop'), 400);

  startTimer();
}

function handleChoice(btn, choice, q) {
  if (answered) return;
  answered = true;
  stopTimer();

  const correct = parseInt(choice) === q.answer || choice === String(q.answer);

  if (correct) {
    btn.classList.add('correct');
    handleCorrect();
  } else {
    btn.classList.add('wrong');
    handleWrong(`The answer is ${q.answer}`);
    revealAnswer();
  }
  document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
  showNext();
}

function handleSubmit() {
  if (answered) return;
  const input = document.getElementById('answerInput');
  const val = parseInt(input.value);
  if (isNaN(val)) { input.classList.add('shake'); setTimeout(() => input.classList.remove('shake'), 400); return; }

  answered = true;
  stopTimer();
  const q = questions[qIndex];

  if (val === q.answer) {
    input.classList.add('correct');
    handleCorrect();
  } else {
    input.classList.add('wrong');
    handleWrong(`The answer was ${q.answer}`);
    input.classList.add('shake');
  }
  showNext();
}

function handleCorrect() {
  streak++;
  bestStreak = Math.max(bestStreak, streak);
  correctCount++;
  let pts = POINTS.correct;
  if (timeLeft > 0) pts += POINTS.timerBonus;
  if (streak >= 5) pts += POINTS.streak5;
  else if (streak >= 3) pts += POINTS.streak3;
  score += pts;
  document.getElementById('scoreDisplay').textContent = score;

  let msg = streak >= 5 ? `🔥 ${streak} in a row! +${pts} pts`
           : streak >= 3 ? `⚡ Streak x${streak}! +${pts} pts`
           : `✅ Correct! +${pts} pts`;
  showFeedback(true, msg);

  if (streak >= 3) showStreakBadge(`🔥 ${streak} in a row!`);
}

function handleWrong(detail) {
  streak = 0;
  wrongCount++;
  showFeedback(false, `❌ Oops! ${detail}`);
}

function revealAnswer() {
  document.querySelectorAll('.choice-btn').forEach(btn => {
    if (String(questions[qIndex].answer) === btn.textContent) btn.classList.add('reveal');
  });
}

function showFeedback(correct, msg) {
  const el = document.getElementById('feedbackBanner');
  el.textContent = msg;
  el.className = `feedback show ${correct ? 'correct' : 'wrong'}`;
}

function showNext() {
  document.getElementById('nextBtn').className = 'next-btn show';
}

function showStreakBadge(msg) {
  const badge = document.getElementById('streakBadge');
  badge.textContent = msg;
  badge.classList.add('show');
  setTimeout(() => badge.classList.remove('show'), 1800);
}

// ─────────────────────────────────────────────
//  RESULTS
// ─────────────────────────────────────────────
function showResults() {
  const pct = correctCount / TOTAL_QUESTIONS;
  const stars = pct >= .9 ? '⭐⭐⭐' : pct >= .6 ? '⭐⭐' : '⭐';
  const trophy = pct >= .9 ? '🏆' : pct >= .6 ? '🥈' : '🎖️';
  const msgs = {
    '🏆': ["Perfect! You're a math superstar! 🌟", "Amazing! You nailed it! 🎉", "Incredible! Math genius! 🧠"],
    '🥈': ["Great job! Keep practicing! 💪", "Well done! You're getting better! 📈", "Nice work! Almost perfect! 🎯"],
    '🎖️': ["Good effort! Try again! 🔄", "Keep going — practice makes perfect! 📚", "You can do it — try again! 🚀"]
  };
  const msg = msgs[trophy][rand(0, 2)];

  showScreen('resultsScreen');
  document.getElementById('trophyEmoji').textContent = trophy;
  document.getElementById('finalScore').textContent = score;
  document.getElementById('starsDisplay').textContent = stars;
  document.getElementById('statCorrect').textContent = correctCount;
  document.getElementById('statWrong').textContent = wrongCount;
  document.getElementById('statStreak').textContent = bestStreak;
  document.getElementById('resultMessage').textContent = msg;

  if (pct >= .9) launchConfetti();
}

function launchConfetti() {
  const colors = ['#FF6B35','#FFD23F','#06D6A0','#118AB2','#8338EC','#FF006E'];
  for (let i = 0; i < 80; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = `${Math.random() * 100}vw`;
    el.style.top = '-20px';
    el.style.background = colors[rand(0, colors.length - 1)];
    el.style.transform = `rotate(${rand(0, 360)}deg)`;
    el.style.animationDuration = `${rand(2000, 4000)}ms`;
    el.style.animationDelay = `${rand(0, 1000)}ms`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 5000);
  }
}

// ─────────────────────────────────────────────
//  SCREEN MANAGEMENT
// ─────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ─────────────────────────────────────────────
//  EVENT LISTENERS
// ─────────────────────────────────────────────

// Difficulty buttons
document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    difficulty = btn.dataset.diff;
  });
});

// Type toggle buttons
document.querySelectorAll('.type-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const t = btn.dataset.type;
    if (enabledTypes.has(t)) {
      if (enabledTypes.size === 1) return; // must have at least one
      enabledTypes.delete(t);
      btn.classList.remove('selected');
    } else {
      enabledTypes.add(t);
      btn.classList.add('selected');
    }
  });
});

// Start
document.getElementById('startBtn').addEventListener('click', () => {
  score = 0; qIndex = 0; correctCount = 0; wrongCount = 0; streak = 0; bestStreak = 0;
  questions = generateQuestions();
  document.getElementById('scoreDisplay').textContent = '0';
  showScreen('gameScreen');
  renderQuestion();
});

// Submit answer (input mode)
document.getElementById('submitBtn').addEventListener('click', handleSubmit);
document.getElementById('answerInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleSubmit();
});

// Next question
document.getElementById('nextBtn').addEventListener('click', () => {
  qIndex++;
  if (qIndex >= TOTAL_QUESTIONS) { showResults(); return; }
  renderQuestion();
});

// Play again
document.getElementById('playAgainBtn').addEventListener('click', () => {
  score = 0; qIndex = 0; correctCount = 0; wrongCount = 0; streak = 0; bestStreak = 0;
  questions = generateQuestions();
  document.getElementById('scoreDisplay').textContent = '0';
  showScreen('gameScreen');
  renderQuestion();
});

// Change settings
document.getElementById('changeSettingsBtn').addEventListener('click', () => {
  showScreen('startScreen');
});
</script>
